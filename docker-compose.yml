version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: autoloc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: autoloc_db
      MYSQL_USER: autoloc
      MYSQL_PASSWORD: autoloc_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:2000
    command:
      --default-auth-encoding=utf8mb4
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

volumes:
  mysql-data: