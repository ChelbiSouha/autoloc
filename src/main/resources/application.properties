spring.application.name=autoloc-api

# Database: MySQL 8.x (ou PostgreSQL). Le conteneur Docker MySQL écoute sur le port 3306.
# Si vous utilisez PostgreSQL à la place, modifiez uniquement l'URL JDBC et le driver.

# ===== DATABASE =====
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
# Pool HikariCP par défaut avec Spring Boot

# ===== JPA / HIBERNATE =====
# Hibernate auto-ddl: create-drop (atelier), validate, or update
spring.jpa.hibernate.ddl-auto=update
# Affichage des requêtes SQL dans les logs (utile pour le débogage)
spring.jpa.show-sql=true
# Formatage des SQL dans les logs
spring.jpa.properties.hibernate.format_sql=true

# ===== LOMBOK =====
# Activation du traitement des annotations (déjà activé dans IDEA compiler.xml)
# En environnement Maven, Lombok génère le code à la compilation.

# ===== SPRINGDOC / SWAGGER (springdoc-openapi) =====
# Configuration OpenAPI / Swagger UI
springdoc.api.title=AutoLoc API
springdoc.api.description=Plateforme de gestion de location de véhicules multi-agences
springdoc.api.version=1.0.0
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ===== JACKSON / JSON =====
# Configuration Lombok + Jackson
spring.jackson.serialization.INDENT_OUTPUT=true

# ===== LOGGING =====
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO

# ===== MOCK / TEST =====
# Configuration MockMvc par défaut
spring.mockmvc.serve-mock-context=servlet
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
